# MAN on Render: a free static site, so the URL is permanent and never sleeps.
# The whole app is web/ (index.html + song.m4a) — there is nothing to build and no server to run.
services:
  - type: web
    name: man-button
    runtime: static
    buildCommand: echo "nothing to build"
    staticPublishPath: web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
