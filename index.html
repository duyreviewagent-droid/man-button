<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAN</title>
<style>
  :root { --lvl: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b0b10; color: #fff;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  body { display: grid; place-items: center; }

  /* stage: spotlight that throbs with the song */
  #stage { position: fixed; inset: 0;
    background:
      radial-gradient(circle at 50% 52%, rgba(255, 40, 40, calc(0.10 + var(--lvl) * 0.45)) 0, transparent calc(30% + var(--lvl) * 25%)),
      radial-gradient(ellipse at 50% 0%, #26262f 0, #0b0b10 70%); }
  #floor { position: fixed; left: 0; right: 0; bottom: 0; height: 30%;
    background: linear-gradient(#0b0b1000, #15151c); }

  canvas#fx { position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; }

  #wrap { position: relative; width: min(62vmin, 520px); aspect-ratio: 1; display: grid; place-items: center; }
  svg#ring { position: absolute; inset: -6%; width: 112%; height: 112%; transform: rotate(-90deg); pointer-events: none; }
  svg#ring circle { fill: none; stroke-width: 2.2; }
  #ringBg { stroke: #ffffff12; }
  #ringFg { stroke: #ff3b3b; stroke-linecap: round; filter: drop-shadow(0 0 6px #ff3b3b); transition: opacity .3s; }

  /* the button: a metal collar, then the red dome on top */
  #collar { position: absolute; inset: 6%; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #6b6b74, #2a2a31 60%, #141418);
    box-shadow: 0 30px 60px #000c, inset 0 2px 3px #fff4, inset 0 -6px 14px #0009; }
  #btn { position: relative; width: 74%; aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer; outline: none;
    background: radial-gradient(circle at 50% 32%, #ff6a5e 0, #f01e1e 38%, #b30d10 72%, #6e0508 100%);
    box-shadow: 0 calc(var(--depth) * 1px) 0 #5c0306, 0 calc(var(--depth) * 1px + 18px) 30px #000a,
      inset 0 -10px 24px #4d0004aa, inset 0 6px 10px #ffb3a8aa;
    transform: translateY(calc((18 - var(--depth)) * 1px));
    --depth: 18; transition: transform .07s, box-shadow .07s; }
  #btn.down { --depth: 4; }
  #btn::before { content: ""; position: absolute; left: 22%; top: 9%; width: 56%; height: 30%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 30%, #fff9, #fff0 70%); pointer-events: none; }
  #btn span { position: relative; display: block; font-weight: 900; font-size: min(15vmin, 128px); letter-spacing: .04em; color: #fff;
    text-shadow: 0 3px 0 #7a0407, 0 6px 14px #0007; transform: scale(calc(1 + var(--lvl) * 0.12)); }

  #hud { position: fixed; top: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; pointer-events: none; }
  .pill { background: #ffffff10; border: 1px solid #ffffff1c; border-radius: 999px; padding: 8px 18px;
    font: 700 15px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .06em; color: #ddd; }
  .pill b { color: #fff; font-size: 18px; margin-left: 6px; }
  #hint { position: fixed; bottom: 26px; left: 0; right: 0; text-align: center; color: #fff6;
    font: 600 14px "Helvetica Neue", Arial, sans-serif; letter-spacing: .08em; pointer-events: none; }
  #mode { position: fixed; bottom: 22px; right: 22px; pointer-events: auto; cursor: pointer;
    font: 700 13px "Helvetica Neue", Arial, sans-serif; color: #ccc; background: #ffffff10; border: 1px solid #ffffff22;
    border-radius: 10px; padding: 9px 13px; }
  #mode:hover { background: #ffffff1c; }
  #saved { position: fixed; bottom: 24px; left: 24px; font: 800 13px "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .12em; color: #7dff9a; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #saved.on { opacity: 1; }

  @media (max-width: 560px) {
    #hud { top: 12px; gap: 6px; flex-wrap: wrap; padding: 0 16px; }
    .pill { padding: 6px 11px; font-size: 11px; } .pill b { font-size: 14px; }
    #mode { bottom: 14px; right: 50%; transform: translateX(50%); } #hint { bottom: 62px; font-size: 12px; }
    #saved { bottom: 64px; }
  }
  body.icon #hud, body.icon #hint, body.icon #mode, body.icon #saved, body.icon svg#ring { display: none; }
  body.icon #wrap { width: 92vmin; }
  body.icon #stage { background: radial-gradient(circle at 50% 50%, #3a1214 0, #0b0b10 70%); }
</style>
</head>
<body>
<div id="stage"></div><div id="floor"></div>
<canvas id="fx"></canvas>

<div id="hud">
  <div class="pill">MAN PRESSES<b id="presses">0</b></div>
  <div class="pill">FULL SONGS<b id="fulls">0</b></div>
  <div class="pill">FASTEST<b id="cps">0</b> /s</div>
</div>

<div id="wrap">
  <svg id="ring" viewBox="0 0 100 100"><circle id="ringBg" cx="50" cy="50" r="47"/><circle id="ringFg" cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="0 100"/></svg>
  <div id="collar"></div>
  <button id="btn" aria-label="MAN"><span>MAN</span></button>
</div>

<button id="mode" title="What a click does while the song is playing"></button>
<div id="hint">CLICK THE BUTTON · OR PRESS SPACE</div>
<script>if (matchMedia("(pointer: coarse)").matches) document.getElementById("hint").textContent = "TAP THE BUTTON";</script>
<div id="saved">SAVED</div>

<script>
const $ = id => document.getElementById(id);
const btn = $("btn"), root = document.documentElement;
const Q = new URLSearchParams(location.search);
if (Q.has("icon")) document.body.classList.add("icon");

// ---------- saved stats ----------
const KEY = "manbutton.v1";
let S = { presses: 0, fulls: 0, cps: 0, restart: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
let dirty = false;
function save(flash) {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  dirty = false;
  if (flash) { $("saved").classList.add("on"); setTimeout(() => $("saved").classList.remove("on"), 1200); }
}
setInterval(() => { if (dirty) save(true); }, 30000);
addEventListener("pagehide", () => save(false));
function showStats() {
  $("presses").textContent = S.presses.toLocaleString();
  $("fulls").textContent = S.fulls.toLocaleString();
  $("cps").textContent = S.cps;
  $("mode").textContent = S.restart ? "CLICK = RESTART SONG" : "CLICK = LET IT PLAY";
}
showStats();
$("mode").onclick = e => { e.stopPropagation(); S.restart = !S.restart; dirty = true; showStats(); };

// ---------- audio: the song, decoded once, a fresh source per press ----------
let ctx, analyser, gain, songBuf, src = null, startedAt = 0, levels, loading;
async function ensureAudio() {
  if (ctx) { if (ctx.state === "suspended") await ctx.resume(); return loading; }   // every press waits for the song to finish decoding
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  gain = ctx.createGain(); gain.gain.value = 1;
  analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.75;
  gain.connect(analyser); analyser.connect(ctx.destination);
  levels = new Uint8Array(analyser.frequencyBinCount);
  loading = fetch("song.m4a").then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)).then(buf => { songBuf = buf; });
  return loading;
}
function clickSound() {           // a chunky "thunk" so the press feels real even mid-song
  const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.09);
  g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.13);
}
function playSong() {
  if (src && !S.restart) return;            // "let it play" mode: presses don't interrupt
  if (src) { src.onended = null; try { src.stop(); } catch (e) {} }
  const s = ctx.createBufferSource(); s.buffer = songBuf; s.connect(gain);
  s.onended = () => { if (src === s) { src = null; S.fulls++; dirty = true; showStats(); burst(40, true); } };
  s.start(); src = s; startedAt = ctx.currentTime;
}

// ---------- pressing ----------
const pressTimes = [];
async function press() {
  btn.classList.add("down");
  S.presses++; dirty = true;
  const now = performance.now(); pressTimes.push(now);
  while (pressTimes.length && now - pressTimes[0] > 1000) pressTimes.shift();
  if (pressTimes.length > S.cps) S.cps = pressTimes.length;
  showStats();
  burst(6 + Math.min(10, pressTimes.length), false);
  try { await ensureAudio(); clickSound(); playSong(); } catch (e) { console.error(e); if (Q.has("dbg")) $("hint").textContent = "ERR " + e; }
}
function release() { btn.classList.remove("down"); }
btn.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
addEventListener("pointerup", release); addEventListener("pointercancel", release);
const held = new Set();
addEventListener("keydown", e => {
  if (!["Space", "Enter", "KeyM"].includes(e.code)) return;
  e.preventDefault(); if (held.has(e.code)) return; held.add(e.code); press();
});
addEventListener("keyup", e => { held.delete(e.code); if (!held.size) release(); });

// ---------- effects: flying "MAN"s, rings, equaliser ----------
const cv = $("fx"), g2 = cv.getContext("2d");
let W, H, DPR;
function resize() { DPR = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g2.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); resize();
const parts = [], rings = [];
const WORDS = ["MAN", "MAN!", "MAN", "MANNN", "MAN!!"];
function burst(n, gold) {
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  rings.push({ x: cx, y: cy, r: r.width / 2, a: 1, gold });
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 260 + Math.random() * 520;
    parts.push({ x: cx + Math.cos(ang) * r.width * 0.3, y: cy + Math.sin(ang) * r.width * 0.3,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 200, rot: (Math.random() - .5) * 0.8, vr: (Math.random() - .5) * 4,
      size: (18 + Math.random() * 34) * Math.max(0.5, Math.min(1.2, r.width / 380)), life: 1, word: WORDS[(Math.random() * WORDS.length) | 0],
      hue: gold ? 45 + Math.random() * 10 : (Math.random() < .7 ? 0 : 20) });
  }
}
let last = performance.now(), lvlSm = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  g2.clearRect(0, 0, W, H);

  // song level + progress
  let lvl = 0;
  if (analyser && src) {
    analyser.getByteFrequencyData(levels);
    let sum = 0; for (let i = 2; i < 40; i++) sum += levels[i];
    lvl = Math.min(1, sum / 38 / 180);
  }
  lvlSm += (lvl - lvlSm) * Math.min(1, dt * 14);
  root.style.setProperty("--lvl", lvlSm.toFixed(3));
  const p = src && songBuf ? Math.min(1, (ctx.currentTime - startedAt) / songBuf.duration) : 0;
  $("ringFg").setAttribute("stroke-dasharray", (p * 100).toFixed(2) + " 100");
  $("ringFg").style.opacity = src ? 1 : 0;

  // equaliser bars around the button
  if (analyser && src) {
    const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = r.width * 0.78;
    const N = 48;
    for (let i = 0; i < N; i++) {
      const v = levels[2 + (i < N / 2 ? i : N - 1 - i)] / 255;   // mirrored so it's symmetric
      const a = (i / N) * Math.PI * 2 - Math.PI / 2, len = 6 + v * r.width * 0.2;
      g2.strokeStyle = `hsla(${355 + v * 30}, 100%, ${50 + v * 20}%, ${0.25 + v * 0.7})`;
      g2.lineWidth = Math.max(3, r.width * 0.018); g2.lineCap = "round";
      g2.beginPath(); g2.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      g2.lineTo(cx + Math.cos(a) * (R + len), cy + Math.sin(a) * (R + len)); g2.stroke();
    }
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    const k = rings[i]; k.r += 520 * dt; k.a -= 1.6 * dt;
    if (k.a <= 0) { rings.splice(i, 1); continue; }
    g2.strokeStyle = k.gold ? `rgba(255,210,80,${k.a})` : `rgba(255,70,70,${k.a * 0.8})`;
    g2.lineWidth = 5 * k.a + 1; g2.beginPath(); g2.arc(k.x, k.y, k.r, 0, Math.PI * 2); g2.stroke();
  }
  g2.textAlign = "center"; g2.textBaseline = "middle";
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.vy += 700 * dt; q.vx *= 1 - dt * 0.8; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt; q.life -= dt * 0.7;
    if (q.life <= 0 || q.y > H + 80) { parts.splice(i, 1); continue; }
    g2.save(); g2.translate(q.x, q.y); g2.rotate(q.rot); g2.globalAlpha = Math.min(1, q.life * 1.6);
    g2.font = `900 ${q.size}px "Arial Black", Arial, sans-serif`;
    g2.lineWidth = q.size * 0.14; g2.strokeStyle = "#000a"; g2.strokeText(q.word, 0, 0);
    g2.fillStyle = `hsl(${q.hue}, 100%, ${q.hue > 30 ? 60 : 58}%)`; g2.fillText(q.word, 0, 0);
    g2.restore();
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook: ?dbg=1 shows the audio state in the hint line
if (Q.has("dbg")) setInterval(() => { $("hint").textContent = ctx ? `ctx ${ctx.state} t=${ctx.currentTime.toFixed(2)} song=${songBuf ? songBuf.duration.toFixed(2) + "s" : "loading"} playing=${!!src}` : "no audio yet"; }, 200);
// test hook: ?auto=1 presses the button a few times (for screenshots)
if (Q.has("auto")) { let n = 0; const iv = setInterval(() => { press(); setTimeout(release, 80); if (++n > 6) clearInterval(iv); }, 160); }
</script>
</body>
</html>
